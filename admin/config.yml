backend:
  name: git-gateway
  branch: main

locale: "fr"

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "activites"
    label: "Programme d'activités"
    label_singular: "Activité"
    description: "Les événements à venir affichés en haut du site."
    folder: "content/activites"
    create: true
    delete: true
    format: "json"
    extension: "json"
    slug: "{{titre}}"
    summary: "{{titre}}"
    fields:
      - { label: "Titre", name: "titre", widget: "string" }
      - label: "Dates"
        name: "dates"
        widget: "list"
        required: true
        min: 1
        summary: "{{fields.date}}"
        field: { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false, date_format: "DD/MM/YYYY" }
      - { label: "Heure (ex. 19h à 21h)", name: "heure", widget: "string", required: false }
      - { label: "Lieu", name: "lieu", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Affiche ou photo (facultatif)", name: "image", widget: "image", required: false }

  - name: "pensees"
    label: "Pensées"
    label_singular: "Pensée"
    description: "Réflexions et pensées spirituelles affichées sur le site."
    folder: "content/pensees"
    create: true
    delete: true
    format: "json"
    extension: "json"
    slug: "{{date}}-{{slug}}"
    summary: "{{titre}}"
    fields:
      - { label: "Titre (facultatif)", name: "titre", widget: "string", required: false }
      - { label: "Texte", name: "texte", widget: "text" }
      - { label: "Auteur ou référence (facultatif)", name: "auteur", widget: "string", required: false }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false, date_format: "DD/MM/YYYY" }
      - { label: "Image (facultatif)", name: "image", widget: "image", required: false }

  - name: "galerie"
    label: "Galerie de photos"
    label_singular: "Photo"
    description: "Photos ajoutées à la galerie du site."
    folder: "content/galerie"
    create: true
    delete: true
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    summary: "{{legende}}"
    fields:
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Légende", name: "legende", widget: "string", required: false }
