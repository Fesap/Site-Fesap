const GITHUB_BRANCH = 'main';

// Va chercher le contenu publié par l'administrateur (activités, pensées, galerie)
// directement depuis le dépôt GitHub, sans backend ni base de données.
function useCmsCollection(folder) {
  const [items, setItems] = React.useState([]);
  React.useEffect(() => {
    let cancelled = false;
    fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/content/${folder}?ref=${GITHUB_BRANCH}`)
      .then((r) => (r.ok ? r.json() : []))
      .then((files) => Promise.all(
        (Array.isArray(files) ? files : [])
          .filter((f) => f.name.endsWith('.json'))
          .map((f) => fetch(f.download_url).then((r) => r.json()).catch(() => null))
      ))
      .then((list) => { if (!cancelled) setItems(list.filter(Boolean)); })
      .catch(() => { if (!cancelled) setItems([]); });
    return () => { cancelled = true; };
  }, [folder]);
  return items;
}

function formatDateFr(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase().replace('.', '');
}

// Regroupe plusieurs dates du même mois : "4, 11, 18 et 25 septembre 2026"
function formatDatesFr(isoList) {
  const dates = (isoList || [])
    .filter(Boolean)
    .map((iso) => new Date(iso + 'T00:00:00'))
    .filter((d) => !isNaN(d))
    .sort((a, b) => a - b);
  if (dates.length === 0) return '';
  const sameMonthYear = dates.every((d) => d.getMonth() === dates[0].getMonth() && d.getFullYear() === dates[0].getFullYear());
  if (sameMonthYear) {
    const days = dates.map((d) => d.getDate());
    const monthYear = dates[0].toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    const daysStr = days.length === 1 ? `${days[0]}` : `${days.slice(0, -1).join(', ')} et ${days[days.length - 1]}`;
    return `${daysStr} ${monthYear}`;
  }
  return dates.map((d) => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' })).join(' · ');
}

function WorldMap({ active, onSelect }) {
  const pins = [
    { key: 'ouaga', label: 'Ouagadougou', lon: -1.5197, lat: 12.3714, tone: 'var(--color-primary)' },
    { key: 'banfora', label: 'Banfora', lon: -4.7602, lat: 10.6329, tone: 'var(--color-primary)' },
    { key: 'canada', label: 'Montréal', lon: -73.5674, lat: 45.5019, tone: 'var(--color-accent)' },
  ];
  const W = 960, H = 460;
  const [landPath, setLandPath] = React.useState(null);
  const [pinPos, setPinPos] = React.useState(null);

  React.useEffect(() => {
    let cancelled = false;
    fetch('https://unpkg.com/world-atlas@2/land-110m.json')
      .then((r) => r.json())
      .then((topo) => {
        if (cancelled || !window.d3 || !window.topojson) return;
        const land = window.topojson.feature(topo, topo.objects.land);
        const projection = window.d3.geoNaturalEarth1().fitSize([W - 40, H - 40], land).translate([W / 2, H / 2 + 6]);
        const path = window.d3.geoPath(projection);
        setLandPath(path(land));
        setPinPos(pins.map((p) => {
          const [x, y] = projection([p.lon, p.lat]);
          return { ...p, x, y };
        }));
      })
      .catch(() => {});
    return () => { cancelled = true; };
  }, []);

  return (
    <div style={{
      position: 'relative', width: '100%', background: 'linear-gradient(180deg, #F4F8F6, #EAF1EE)',
      borderRadius: 'var(--radius-lg)', boxShadow: 'var(--shadow-md)', overflow: 'hidden',
    }}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', display: 'block' }}>
        <defs>
          <linearGradient id="landGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="var(--fesap-green-600)" />
            <stop offset="100%" stopColor="var(--fesap-green-700)" />
          </linearGradient>
        </defs>
        {landPath && <path d={landPath} fill="var(--fesap-green-600)" fillOpacity="0.5" stroke="var(--fesap-green-700)" strokeWidth="0.6" strokeOpacity="0.5" strokeLinejoin="round" />}
        {pinPos && pinPos.map((p) => {
          const isActive = p.key === active;
          return (
            <g
              key={p.key}
              onClick={() => onSelect && onSelect(p.key)}
              style={{ cursor: 'pointer' }}
            >
              {isActive && <circle cx={p.x} cy={p.y} r="12" fill={p.tone} opacity="0.18" />}
              <circle cx={p.x} cy={p.y} r={isActive ? 7 : 5} fill={p.tone} stroke="#fff" strokeWidth={isActive ? 2.5 : 2} style={{ transition: 'r var(--duration-fast) var(--ease-standard)', filter: 'drop-shadow(0 1px 2px rgba(0,0,0,0.25))' }} />
            </g>
          );
        })}
      </svg>
      {pinPos && pinPos.map((p) => {
        const isActive = p.key === active;
        if (!isActive) return null;
        return (
          <div key={p.key} style={{
            position: 'absolute', left: `${(p.x / W) * 100}%`, top: `${(p.y / H) * 100}%`,
            transform: 'translate(-50%, -135%)', pointerEvents: 'none',
            padding: '5px 12px', borderRadius: 'var(--radius-pill)', background: p.tone, color: '#fff',
            font: 'var(--text-label-sm)', letterSpacing: 'var(--tracking-label)', textTransform: 'uppercase',
            whiteSpace: 'nowrap', boxShadow: 'var(--shadow-md)',
          }}>
            {p.label}
          </div>
        );
      })}
      <div style={{
        position: 'absolute', bottom: 10, right: 14, font: 'var(--text-body-sm)', color: 'var(--color-text-muted)',
        background: 'rgba(255,255,255,0.85)', padding: '3px 10px', borderRadius: 'var(--radius-pill)',
      }}>
        Cliquez sur un repère
      </div>
    </div>
  );
}

// ---------- Événements (programme d'activités géré par l'administrateur) ----------

  const sorted = [...events].sort((a, b) => (a._dates[0] || '').localeCompare(b._dates[0] || ''));

    <section data-screen-label="Événements" id="evenements" style={{ scrollMarginTop: 76, background: 'var(--color-surface-sunken)' }}>

            <Card key={i} style={{ display: 'flex', gap: 24, flexWrap: 'wrap', alignItems: 'flex-start' }}>

                <Photo src={e.image} alt={e.titre} fit="contain" style={{ width: 180, height: 220, flexShrink: 0, background: 'var(--color-surface-sunken)' }} />
              )}
              <div style={{ flex: '1 1 260px' }}>
                <div style={{ font: 'var(--text-display-md)', color: 'var(--color-primary)', marginBottom: 10 }}>{e.titre}</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 12 }}>
                  <div style={{ font: 'var(--text-body-sm)', color: 'var(--color-text-muted)', display: 'flex', alignItems: 'center', gap: 6 }}>
                    <Icon name="calendar" size={14} color="var(--color-text-muted)" />{formatDatesFr(e._dates)}

// ---------- App ----------
function App() {
  const [active, setActive] = React.useState('accueil');
  const sectionIds = ['accueil', 'histoire', 'communautes', 'activites', 'galerie'];

  const handleNav = (id) => {
    setActive(id);
    const el = document.getElementById(id);
    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 76, behavior: 'smooth' });
  };

  React.useEffect(() => {
    const onScroll = () => {
      let current = sectionIds[0];
      for (const id of sectionIds) {
        const el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top < 140) current = id;
      }
      setActive(current);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <div>
      <MeetingBanner />
      <Header active={active} onNav={handleNav} />
      <HomeSection />
      <EventsSection />
      <HistorySection />
      <PenseesSection />
      <CommunitiesSection />
      <BishopVisitSection />
      <ActivitiesSection />
      <MontrealPrayerSection />
      <TestimonialsSection />
      <GallerySection />
      <DonateSection />
      <Footer />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
